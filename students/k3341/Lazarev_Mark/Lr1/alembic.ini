# Конфигурация Alembic.
#
# ВАЖНО: строка подключения к БД здесь НЕ хранится.
# sqlalchemy.url намеренно отсутствует — URL берётся из переменной окружения
# DATABASE_URL (см. .env.example) и подставляется в alembic/env.py.
# Поэтому этот файл безопасно коммитить: в нём нет ни логина, ни пароля.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
